# Dashboard host. Tunnels are served on its direct subdomains
# (https://myapp.<domain>), so point both <domain> and *.<domain> at Traefik.
domain: gate.example.com

# The name in the resources' names and labels, the chart's by default. A
# release installed with the gate2net chart, intergate's former name, keeps
# its resources and its volume with nameOverride: gate2net.
nameOverride: ""

image:
  repository: ghcr.io/jgermade/intergate
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# intergate configuration, merged over the chart's defaults (public_url,
# ports, data_dir, trust_proxy_headers, ssh.public_*). Any option of
# intergate.example.yaml can go here. Reference secrets as ${VAR} and put
# them in secretEnv or existingSecret.
#
# Client addresses come from Traefik, which intergate trusts when it
# connects from a private network (trusted_proxies), as pods usually do. If
# your pods have public addresses (some IPv6 clusters), set
# trusted_proxies to the pods' range, e.g. trusted_proxies: ["2001:db8:42::/56"].
#
# Without email delivery or admins, the dashboard's setup asks for them on
# a one-time link (`kubectl exec deploy/intergate -- intergate setup-url`):
# the SMTP server, stored on the volume with its password encrypted, and
# the owner. To manage them with Helm instead, set them here:
config: {}
#  auth:
#    admins: [you@example.com]
#    email:
#      from: "intergate <no-reply@gate.example.com>"
#      smtp:
#        host: smtp.example.com
#        port: 587
#        username: intergate
#        password: ${SMTP_PASSWORD}

# Environment variables stored in a Secret created by the chart: the
# secrets config references as ${VAR}, or the SMTP password of the
# dashboard's setup, once `intergate config` reads it from one (env:NAME).
secretEnv: {}
#  SMTP_PASSWORD: change-me
#  GITHUB_CLIENT_SECRET: change-me

# Or use a Secret you manage, e.g. filled from Vault by the External
# Secrets Operator; each key becomes an environment variable.
existingSecret: ""

# SSH host and port users type in `ssh -p <port> <host>`. The port must be
# the one Traefik's SSH entry point (or sshService) exposes.
ssh:
  publicHost: ""   # defaults to domain
  publicPort: 2222

traefik:
  # Route the dashboard and every tunnel through a Traefik IngressRoute.
  enabled: true
  entryPoints: [websecure]
  tls:
    # Let intergate terminate TLS itself, with Let's Encrypt, as it does
    # with the binary or Docker: Traefik routes the HTTPS connections of
    # <domain> and its subdomains by name without decrypting them, with the
    # PROXY protocol so intergate sees client addresses. The dashboard works
    # once installed, each subdomain gets a certificate as it is registered,
    # and an owner can set up a DNS provider in the dashboard (Admin → DNS)
    # for one wildcard certificate. certResolver, secretName and certManager
    # are not used then. The certificates live on the volume: keep
    # persistence enabled.
    passthrough: false
    # With passthrough: Let's Encrypt's contact for the certificates, and
    # Traefik's entry points for plain HTTP (redirects to HTTPS, HTTP-01).
    acmeEmail: ""
    httpEntryPoints: [web]
    # Without passthrough, Traefik terminates TLS. Name of a Traefik
    # certificate resolver: tunnels need a certificate for *.<domain>, so
    # the resolver must use the DNS-01 challenge.
    certResolver: ""
    # Or an existing TLS secret holding a certificate for <domain> and
    # *.<domain> (see certManager below).
    secretName: ""
  # SSH over a TCP entry point of Traefik, e.g. started with
  # --entryPoints.ssh.address=:2222 and exposed by the Traefik service.
  ssh:
    enabled: true
    entryPoint: ssh
    # Send the client address with the PROXY protocol, so intergate logs
    # and shows real client IPs. Leave sshService disabled when using it.
    proxyProtocol: true

# Alternative to Traefik for SSH: a Service of its own (e.g. a LoadBalancer).
sshService:
  enabled: false
  type: LoadBalancer
  port: 2222
  annotations: {}
  loadBalancerIP: ""

# TCP and UDP ports for subdomains (databases, SSH, games...), allocated
# from first..last. Each port gets an entry in a Service of its own, by
# default a LoadBalancer that keeps client addresses (externalTrafficPolicy:
# Local) so allow lists work: keep the range small.
tcp:
  enabled: false
  first: 30000
  last: 30019
  maxPorts: 5
  # Also expose the range over UDP, for UDP ports (the intergate client).
  # Needs LoadBalancers that take both protocols (Kubernetes 1.26+).
  udp: true
  # Host in the ports' addresses; defaults to ssh.publicHost, then domain.
  publicHost: ""
  service:
    type: LoadBalancer
    annotations: {}
    loadBalancerIP: ""

# Issue the wildcard certificate with cert-manager (needs a DNS-01 issuer).
# The secret is used by the IngressRoute when traefik.tls.secretName is empty.
certManager:
  enabled: false
  issuerRef:
    name: letsencrypt-dns
    kind: ClusterIssuer

persistence:
  # The SQLite database, SSH host key and signing key live here, and what
  # the dashboard's setup saves. Without persistence, every restart changes
  # the SSH host key, signs users out and undoes the setup.
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes: [ReadWriteOnce]
  existingClaim: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]
