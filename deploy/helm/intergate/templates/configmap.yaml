{{- $sshPublicHost := .Values.ssh.publicHost | default .Values.domain -}}
{{- $http := dict "listen" ":8080" "trust_proxy_headers" true -}}
{{- if eq (include "intergate.passthrough" .) "true" }}
{{- /* TLS comes straight from visitors, through Traefik: no proxy headers to trust. */}}
{{- $acme := dict "enabled" true -}}
{{- with .Values.traefik.tls.acmeEmail }}{{ $_ := set $acme "email" . }}{{ end -}}
{{- $http = dict "listen" ":8080" "tls" (dict "listen" ":8443" "proxy_protocol" true "acme" $acme) -}}
{{- end -}}
{{- $defaults := dict
  "public_url" (printf "https://%s" .Values.domain)
  "data_dir" "/data"
  "http" $http
  "ssh" (dict "listen" ":2222" "public_host" $sshPublicHost "public_port" (int .Values.ssh.publicPort) "proxy_protocol" (eq (include "intergate.proxyProtocol" .) "true"))
-}}
{{- if .Values.tcp.enabled }}
{{- $_ := set $defaults "tcp" (dict "ports" (printf "%d-%d" (int .Values.tcp.first) (int .Values.tcp.last)) "max_ports" (int .Values.tcp.maxPorts) "public_host" (.Values.tcp.publicHost | default $sshPublicHost)) }}
{{- end }}
{{- $config := mergeOverwrite $defaults (deepCopy .Values.config) -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intergate.fullname" . }}
  labels:
    {{- include "intergate.labels" . | nindent 4 }}
data:
  intergate.yaml: |
    {{- toYaml $config | nindent 4 }}
