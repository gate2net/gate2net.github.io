<script :setup>
  // The signed-in user's subdomains, and the form that registers one.
  const [
    { app },
    { api },
    { ago },
    RegisterForm,
    StatusBadge,
    AccessBadge,
    Alert,
    Badge,
    Button,
    Card,
    Icon,
    Modal,
  ] = await C79.importAll([
    "@ui/lib/store.js",
    "@ui/lib/api.js",
    "@ui/lib/format.js",
    "@ui/components/register-form.html",
    "@ui/components/status-badge.html",
    "@ui/components/access-badge.html",
    "@theme/components/alert.html",
    "@theme/components/badge.html",
    "@theme/components/button.html",
    "@theme/components/card.html",
    "@theme/components/icon.html",
    "@theme/components/modal.html",
  ])

  document.title = "Subdomains · intergate"

  let subdomains = []
  let loadError = ""
  const load = async () => {
    try {
      subdomains = await api("GET", "/subdomains")
      loadError = ""
    } catch (e) {
      loadError = e.message
    }
  }
  await load()

  // Tunnels come and go: keep the list current while it is on screen.
  $attached(() => {
    const timer = setInterval(() => document.hidden || load(), 5000)
    const off = $detached(() => {
      clearInterval(timer)
      off()
    })
  })

  // With subdomains listed, the register form opens in a dialog, new each
  // time: it stays while the dialog plays its way out, and goes once it
  // has.
  let registering = false
  let registerForm = false
  const openRegister = () => {
    registerForm = true
    registering = true
  }
</script>

<div class="page-head">
  <div class="page-title"><h1 class="hide-narrow">Subdomains</h1><Badge size="lg">{{ subdomains.length }} of {{ app.limits.subdomains }}</Badge></div>
  <span :if="subdomains.length" class="hide-wide"><Button icon="plus" size="sm" label="Register a subdomain" @click="openRegister">Subdomain</Button></span>
  <span :if="subdomains.length" class="hide-narrow"><Button icon="plus" @click="openRegister">Register a subdomain</Button></span>
</div>

<Alert :if="loadError" tone="bad">{{ loadError }}</Alert>

<Card :if="subdomains.length">
  <div class="table-wrap">
    <table class="table tiles">
      <thead class="hide-narrow"><tr><th>Subdomain</th><th>Status</th><th>Access</th><th>SSH keys</th><th></th></tr></thead>
      <tbody>
        <tr :each="sub in subdomains" :key="sub.name">
          <td>
            <a class="name-cell" :href="'/subdomains/' + encodeURIComponent(sub.name)">
              <span class="host"><strong>{{ sub.name }}</strong><span class="muted">.{{ app.domain }}</span></span>
            </a>
            <div class="row-badges hide-wide"><StatusBadge :tunnel="sub.tunnel" /><AccessBadge :access="sub.access" /></div>
          </td>
          <td class="hide-narrow"><StatusBadge :tunnel="sub.tunnel" /><span :if="sub.tunnel" class="muted small">{{ ago(sub.tunnel.created_at) }}</span></td>
          <td class="hide-narrow"><AccessBadge :access="sub.access" /></td>
          <td class="hide-narrow">{{ sub.keys }}</td>
          <td class="right row-actions">
            <Button variant="ghost" square icon="external" title="Open" :label="'Open ' + sub.url" :href="sub.url" target="_blank" />
            <Button variant="ghost" square icon="sliders" title="Manage" :label="'Manage ' + sub.name" :href="'/subdomains/' + encodeURIComponent(sub.name)" />
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</Card>
<Card :elseif="!loadError">
  <div class="empty">
    <span class="empty-icon"><Icon name="globe" size="2xl" weight="thin" /></span>
    <p>No subdomains yet. Register one with your SSH public key, then connect with <code>ssh -R</code>.</p>
  </div>
</Card>

<Card :if="!subdomains.length" title="Register a subdomain">
  <RegisterForm />
</Card>

<Modal :open="registering" size="lg" title="Register a subdomain" @close="registering = false" @closed="registerForm = false">
  <RegisterForm :if="registerForm" :cancel="true" @cancel="registering = false" />
</Modal>
