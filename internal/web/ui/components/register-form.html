<script :setup="{ cancel = false }">
  // The form that registers a subdomain, starting public, and opens its
  // page once registered. With `:cancel`, it has a Cancel button that
  // emits `cancel`, for a dialog.
  const { app, go, toast } = await import("@ui/lib/store.js")
  const { api } = await import("@ui/lib/api.js")
  const AccessOptions = await import("@ui/components/access-options.html")
  const Alert = await import("@theme/components/alert.html")
  const Button = await import("@theme/components/button.html")
  const Select = await import("@theme/components/select.html")

  // A key of the account can open it from the start.
  let accountKeys = []
  try {
    accountKeys = await api("GET", "/account/keys")
  } catch {}
  const short = fp => fp.replace(/^SHA256:/, "").slice(0, 12) + "…"
  const KEY_ITEMS = [
    { value: 0, label: "None", hint: "Add keys later, or paste them below", icon: "close" },
    ...accountKeys.map(k => ({ value: k.id, label: k.name, hint: `${k.type} · ${short(k.fingerprint)}`, icon: "key" })),
  ]
  let accountKey = accountKeys.length === 1 ? accountKeys[0].id : 0

  let name = ""
  let access = "public"
  let keys = ""
  let busy = false
  let error = ""

  const register = async () => {
    busy = true
    error = ""
    try {
      const result = await api("POST", "/subdomains", { name, access, keys, account_keys: accountKey ? [accountKey] : [] })
      const host = `${result.subdomain.name}.${app.domain}`
      const problems = result.keys.problems || []
      if (problems.length) toast(`${host} is registered, but some keys were not added: ${problems.join("; ")}.`, "error")
      else toast(`${host} is registered with ${result.keys.added} SSH key(s).`)
      $emit("registered")
      go("/subdomains/" + encodeURIComponent(result.subdomain.name))
    } catch (e) {
      error = e.message
    }
    busy = false
  }
</script>

<form class="form" @submit.prevent="register">
  <Alert :if="error" tone="bad" flush>{{ error }}</Alert>
  <label>Name
    <span class="input-suffix">
      <input name="name" required maxlength="63" pattern="[A-Za-z0-9]([A-Za-z0-9\-]{0,61}[A-Za-z0-9])?" placeholder="myapp"
             autocomplete="off" spellcheck="false" :value="name" @input="name = $event.target.value">
      <span>.{{ app.domain }}</span>
    </span>
  </label>
  <fieldset>
    <legend>Who can open it <span class="hint">You can change it later on the subdomain’s page.</span></legend>
    <AccessOptions :model="access" @pick="access = $event.detail" />
  </fieldset>
  <label :if="accountKeys.length">SSH key from your account <span class="hint">It opens the tunnel; you can add more later.</span>
    <Select name="account-key" :model="accountKey" :items="KEY_ITEMS" />
  </label>
  <label>{{ accountKeys.length ? "Other SSH public keys" : "SSH public keys" }} <span class="hint">Optional, one per line. You can add more later.</span>
    <textarea name="keys" rows="3" spellcheck="false" placeholder="ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAA… you@laptop"
              :value="keys" @input="keys = $event.target.value"></textarea>
  </label>
  <div class="form-actions">
    <Button :if="cancel" variant="secondary" @click="$emit('cancel')">Cancel</Button>
    <Button type="submit" :disabled="busy">Register</Button>
  </div>
</form>
