<script :setup="{ items = [], model = '', label = '', name = '', disabled = false }">
  // One of a list, in a field like the others of a form: a DNS provider, a
  // service's preset, an SSH key. Each option can have an icon and a line
  // under its name; the closed field shows the chosen one's.
  //
  // **Part of the default theme**: imports only the theme's `icons.js`, and
  // draws only with `tokens.css`. See
  // `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <Select label="DNS provider" :model="provider" :items="[
  //     { value: 'cloudflare', label: 'Cloudflare', hint: 'An API token', icon: 'globe' },
  //     { value: 'gcp', label: 'Google Cloud DNS', hint: 'A service account key', icon: 'server' },
  //   ]" />
  //
  // An item is a string or `{ value, label, hint, icon, disabled }`. The
  // choice goes up through `:model` and as `change`. A customizable select
  // where browsers have one (`appearance: base-select`, its `<button>` with
  // `<selectedcontent>`); elsewhere the browser's own, with the hint after a
  // dot. Icons are drawn here, from `icons.js`: an option holds text and
  // inline SVG, which `<selectedcontent>` copies, not components.
  const { ICONS } = await import("@theme/icons.js")

  const flag = v => v === "" || v === true || v === "true"
  $: options = items.map(o => typeof o === "string" ? { value: o, label: o } : o)
  $: isDisabled = flag(disabled)

  const choose = value => {
    if (value === String(model)) return
    const option = options.find(o => String(o.value) === value)
    const next = option ? option.value : value
    $updateModel(next)
    $emit("change", next)
  }
</script>

<select class="select" :name="name || null" :aria-label="label || null" :disabled="isDisabled" @change="choose($event.target.value)">
  <button type="button"><selectedcontent></selectedcontent></button>
  <option :each="option in options" :key="String(option.value)" :value="String(option.value)"
          :selected="String(option.value) === String(model)" :disabled="!!option.disabled">
    <svg :if="option.icon" class="icon" viewBox="0 0 24 24" aria-hidden="true"><path :d="ICONS[option.icon] || ''" /></svg>
    <span class="text">
      <span class="label">{{ option.label }}</span><span :if="option.hint" class="sep"> · </span><span :if="option.hint" class="hint">{{ option.hint }}</span>
    </span>
  </option>
</select>
