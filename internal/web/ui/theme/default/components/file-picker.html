<script :setup="{ accept = '', button = 'Choose a file', placeholder = 'No file chosen', name = '', chosen = '', label = '' }">
  // A file to read in the browser, in a field like the others of a form:
  // a key, a certificate. A button to choose it, then its name.
  //
  // **Part of the default theme**: imports nothing, and draws only with
  // `tokens.css`. See `RECORD/2026-10-29.a-design-system.completed.md`.
  //
  //   <FilePicker accept=".json,application/json" button="Choose the key"
  //               placeholder="No key chosen" @pick="key = $event.detail.text" />
  //
  // `pick` brings `{ name, text }`, the file's name and content. `chosen`
  // names a file chosen before, shown until another is; `label` names the
  // field for a screen reader when no `<label>` around it does.

  let picked = ""
  $: shown = picked || chosen

  const pick = async event => {
    const file = event.target.files[0]
    if (!file) return
    picked = file.name
    $emit("pick", { name: file.name, text: await file.text() })
  }
</script>

<span class="file" :class.empty="!shown">
  <input type="file" :name="name || null" :accept="accept || null" :aria-label="label || null" @change="pick($event)">
  <span class="button" aria-hidden="true">{{ button }}</span>
  <span class="name">{{ shown || placeholder }}</span>
</span>
